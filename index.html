<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f3ec">
<title>Mi Día · My Day</title>
<style>
  :root { --bg: #f7f3ec; --fg: #2f3640; --muted: #7b8190; --linea: #00000012; --carta: #ffffff; --sombra: #00000018; }
  body.oscuro { --bg: #1f3352; --fg: #eef2fa; --muted: #a9b6cc; --linea: #ffffff1c; --carta: #2b4268; --sombra: #00000040; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; overflow: hidden; transition: background .8s, color .8s; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

  /* Barra de arriba */
  #barra { position: fixed; top: 0; left: 0; right: 0; height: 60px; display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; padding: 0 10px; padding-top: env(safe-area-inset-top); z-index: 5; }
  #barra h1 { text-align: center; font-size: 19px; font-weight: 800; line-height: 1.1; }
  #barra h1 small { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
  .redondo { width: 48px; height: 48px; border-radius: 50%; background: var(--carta); box-shadow: 0 3px 0 var(--sombra); font-size: 24px; display: grid; place-items: center; }
  .redondo:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--sombra); }
  #volver[hidden] { visibility: hidden; display: grid; }
  #candado { justify-self: end; font-size: 18px; width: 40px; height: 40px; opacity: .7; }
  #candado.cargando { animation: llenar 3s linear forwards; }
  @keyframes llenar { from { box-shadow: inset 0 0 0 0 #0003; } to { box-shadow: inset 0 0 0 24px #0003; } }

  #vista { position: fixed; left: 0; right: 0; top: 60px; bottom: 0; padding: 8px 16px max(16px, env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* Tarjetas grandes: el dibujo y el texto crecen con la tarjeta */
  .carta { border-radius: 28px; background: var(--c, var(--carta)); color: #2f3640; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3%; box-shadow: 0 5px 0 var(--sombra); container-type: size; overflow: hidden; padding: 4%; text-align: center; min-height: 0; }
  .carta:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sombra); }
  .carta .emo { font-size: min(46cqh, 52cqw); line-height: 1.05; }
  .carta .es { font-size: min(12cqh, 12cqw); font-weight: 800; line-height: 1.1; }
  .carta .en { font-size: min(8.5cqh, 9cqw); font-weight: 600; opacity: .65; line-height: 1.1; }
  .carta.sola .es { font-size: min(13cqh, 13cqw); }
  .rejilla { display: grid; gap: 14px; height: 100%; }
  .salta { animation: salto .5s; }
  @keyframes salto { 35% { transform: scale(1.05); } 70% { transform: scale(.98); } }

  /* Botones de texto */
  .boton { border-radius: 999px; background: var(--carta); box-shadow: 0 3px 0 var(--sombra); padding: 12px 20px; font-size: 18px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
  .boton:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--sombra); }
  .boton.verde { background: #bfe8c9; color: #24402c; }
  .boton.azul { background: #c9defa; color: #233650; }
  .boton small { font-weight: 600; opacity: .65; font-size: .8em; }

  /* Inicio */
  .hola { text-align: center; font-size: 15px; color: var(--muted); margin: 0 0 10px; }
  .estrellas { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 16px; font-size: 15px; font-weight: 800; color: var(--muted); }

  /* Mi día */
  .agenda { display: grid; grid-template-rows: minmax(0, 1fr) auto auto auto; gap: 12px; height: 100%; }
  .ahora-despues { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; min-height: 0; }
  .marco { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 0; }
  .marco > b { font-size: 15px; color: var(--muted); text-align: center; letter-spacing: .04em; }
  .despues .carta { opacity: .8; }
  .acciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .tira { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x proximity; }
  .tira .mini { flex: none; width: 74px; height: 82px; border-radius: 18px; background: var(--c); box-shadow: 0 3px 0 var(--sombra); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #2f3640; position: relative; scroll-snap-align: center; padding: 2px; text-align: center; line-height: 1.05; }
  .tira .mini .e { font-size: 32px; line-height: 1.1; }
  .tira .mini.hecho { opacity: .35; }
  .tira .mini.hecho::after { content: "✓"; position: absolute; top: 2px; right: 6px; font-size: 20px; color: #2c7a43; }
  .tira .mini.ahora { outline: 4px solid #6aa7e8; outline-offset: 1px; }
  .rutinas { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; color: var(--muted); font-size: 14px; font-weight: 700; }
  .rutinas button { font-size: 26px; width: 50px; height: 50px; border-radius: 16px; background: var(--carta); box-shadow: 0 3px 0 var(--sombra); }
  .fin-dia { display: grid; place-items: center; text-align: center; gap: 8px; font-size: 22px; font-weight: 800; }
  .fin-dia .emo { font-size: 90px; }

  /* Pasos de una rutina e historias */
  .pasos { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; height: 100%; }
  .puntos { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .puntos i { width: 14px; height: 14px; border-radius: 50%; background: var(--linea); box-shadow: inset 0 0 0 2px #0000001a; }
  .puntos i.si { background: #6aa7e8; box-shadow: none; }
  .escena { border-radius: 28px; background: var(--carta); box-shadow: 0 5px 0 var(--sombra); display: grid; grid-template-rows: minmax(0, 1fr) auto; place-items: center; padding: 16px; text-align: center; container-type: size; min-height: 0; }
  .escena .emo { font-size: min(34cqh, 30cqw); line-height: 1.1; letter-spacing: .05em; }
  .escena .es { font-size: clamp(20px, min(6.5cqh, 5.5cqw), 40px); font-weight: 800; line-height: 1.25; }
  .escena .en { font-size: clamp(15px, min(4.6cqh, 4cqw), 28px); font-weight: 600; color: var(--muted); line-height: 1.25; margin-top: 6px; }
  .flechas { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .flechas .redondo { width: 64px; height: 64px; font-size: 30px; }

  /* Espera */
  .espera { display: grid; place-items: center; gap: 16px; height: 100%; align-content: center; }
  .espera svg { width: min(70vw, 52vh); height: min(70vw, 52vh); }
  .opciones { display: grid; grid-template-columns: repeat(2, minmax(120px, 200px)); gap: 14px; }
  .opciones .carta { height: 120px; }

  /* Calma */
  body.oscuro .carta { color: #2f3640; }
  .globo { width: min(62vw, 46vh); height: min(62vw, 46vh); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #cfe3ff, #7fa8e0 70%); box-shadow: 0 0 60px #9cc0f080; transform: scale(.45); will-change: transform; }
  .centro { display: grid; place-items: center; gap: 18px; height: 100%; align-content: center; text-align: center; }
  .centro > div > .es { font-size: 30px; font-weight: 800; }
  .centro > div > .en { font-size: 20px; font-weight: 600; color: var(--muted); }
  .burbujas { position: absolute; inset: 0; overflow: hidden; }
  .burbuja { position: absolute; bottom: -140px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffffffd0, #b9d7ff55 45%, #8fb6ee30 70%); box-shadow: inset 0 0 12px #ffffff80, 0 0 10px #9cc0f040; animation: subir linear forwards; }
  @keyframes subir { to { transform: translate(var(--dx), calc(-100vh - 200px)); } }
  .burbuja.pum { animation: pum .25s ease-out forwards; }
  @keyframes pum { to { transform: var(--t) scale(1.5); opacity: 0; } }
  .manchas { position: absolute; inset: 0; overflow: hidden; filter: blur(40px); opacity: .8; }
  .manchas i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; animation: flotar 24s ease-in-out infinite alternate; }
  .manchas i:nth-child(1) { background: #5b7fc4; left: -20vmax; top: -10vmax; }
  .manchas i:nth-child(2) { background: #7a5bb8; right: -25vmax; top: 20vh; animation-duration: 31s; }
  .manchas i:nth-child(3) { background: #3f8f9a; left: 10vw; bottom: -30vmax; animation-duration: 27s; }
  @keyframes flotar { to { transform: translate(12vmax, -8vmax) scale(1.2); } }
  .sobre { position: relative; z-index: 1; }
  .manos { display: flex; gap: 40px; font-size: 90px; }
  .manos span { transition: transform .25s, opacity .25s; opacity: .45; }
  .manos span.toca { transform: scale(1.25); opacity: 1; }
  .conteo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .conteo i { width: 56px; height: 56px; border-radius: 50%; background: #ffffff14; box-shadow: inset 0 0 0 2px #ffffff30; display: grid; place-items: center; font-style: normal; font-size: 24px; font-weight: 800; }
  .conteo i.si { background: #f2d27a; color: #3b3220; box-shadow: none; animation: salto .5s; }
  .frases { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }

  /* Emociones */
  .sentir-detalle { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; justify-items: center; text-align: center; }
  .sentir-detalle .cara { font-size: min(30vw, 22vh); line-height: 1; }
  .dice .es, .dice .en, .resp .es, .resp .en, .centro > div > .es, .centro > div > .en, .escena .es, .escena .en { display: block; }
  .dice .es { font-size: 28px; font-weight: 800; }
  .dice .en, .resp .en { font-size: 19px; font-weight: 600; color: var(--muted); }
  .sentir-detalle .resp { background: var(--carta); border-radius: 22px; padding: 14px 18px; box-shadow: 0 3px 0 var(--sombra); max-width: 640px; }
  .resp .es { font-size: 21px; font-weight: 700; }
  .resp .en { font-size: 16px; }
  .ayudas { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; width: 100%; max-width: 760px; }
  .ayudas .carta { height: 120px; }
  h2.sub { font-size: 18px; text-align: center; margin: 6px 0 2px; }
  h2.sub small { display: block; font-size: 14px; color: var(--muted); font-weight: 600; }

  /* Historias (lista) */
  .lista-hist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .lista-hist .carta { height: 170px; position: relative; }
  /* Juegos */
  .juego { display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; height: 100%; }
  .juego .escena .emo { font-size: min(40cqh, 30cqw); }
  .opciones-j { display: grid; gap: 12px; min-height: 0; }
  .carta.apagada { opacity: .35; }
  .carta.bien { outline: 6px solid #6cc28a; outline-offset: -6px; }
  .carta.pista { outline: 6px solid #f2c94c; outline-offset: -6px; animation: latido 1s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.04); } }
  .carta.larga .es { font-size: min(9.5cqh, 11cqw); }
  .carta.larga .en { font-size: min(7cqh, 8.5cqw); }
  .carta.larga .emo { font-size: min(34cqh, 40cqw); }
  .orden { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 12px; height: 100%; }
  .orden h2 { text-align: center; font-size: 20px; }
  .orden h2 small { display: block; font-size: 15px; color: var(--muted); font-weight: 600; }
  .huecos { display: flex; gap: 10px; justify-content: center; }
  .hueco { width: min(26vw, 120px); aspect-ratio: 1; border-radius: 22px; border: 3px dashed #c9c2b5; display: grid; place-items: center; font-size: min(13vw, 60px); position: relative; background: #ffffff60; }
  .hueco b { position: absolute; top: 4px; left: 10px; font-size: 16px; color: var(--muted); }
  .hueco.lleno { border-style: solid; border-color: #6cc28a; background: #e6f6ea; animation: salto .5s; }
  .filas-orden { display: grid; gap: 10px; align-content: start; overflow-y: auto; }
  .paso-btn { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 10px; text-align: left; border-radius: 20px; background: var(--c, var(--carta)); box-shadow: 0 4px 0 var(--sombra); padding: 10px 14px; min-height: 84px; color: #2f3640; }
  .paso-btn .e { font-size: 44px; text-align: center; }
  .paso-btn .es { display: block; font-size: 18px; font-weight: 800; line-height: 1.2; }
  .paso-btn .en { display: block; font-size: 14px; font-weight: 600; opacity: .65; }
  .paso-btn.usado { display: none; }
  .paso-btn.pista { outline: 5px solid #f2c94c; animation: latido 1s ease-in-out infinite; }
  .paso-btn.mueve { animation: menear .4s; }
  @keyframes menear { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .mesa { display: grid; gap: 12px; height: 100%; }
  .mem { border-radius: 22px; background: #c9dcf5; box-shadow: 0 4px 0 var(--sombra); font-size: min(12vw, 9vh, 72px); display: grid; place-items: center; transition: transform .3s, background .3s; }
  .mem::before { content: "🌟"; opacity: .55; font-size: .6em; }
  .mem.abierta, .mem.par { background: #fff; transform: rotateY(180deg); }
  .mem.abierta::before, .mem.par::before { content: none; }
  .mem span { display: none; transform: rotateY(180deg); }
  .mem.abierta span, .mem.par span { display: block; }
  .mem.par { box-shadow: 0 0 0 5px #6cc28a; }
  .lista-hist .carta.leida::after { content: "⭐"; position: absolute; top: 8px; right: 12px; font-size: 20px; }

  /* Hablo */
  .hablo { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 10px; height: 100%; }
  .tira-frase { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: stretch; background: var(--carta); border-radius: 22px; padding: 8px; box-shadow: 0 3px 0 var(--sombra); min-height: 96px; }
  .tira-frase .piezas { display: flex; gap: 6px; overflow-x: auto; align-items: center; }
  .tira-frase .piezas:empty::before { content: "Toca los dibujos · Tap the pictures"; color: var(--muted); font-size: 15px; padding-left: 8px; }
  .pieza { flex: none; min-width: 72px; height: 78px; border-radius: 14px; background: var(--c, #eee); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; padding: 0 6px; color: #2f3640; }
  .pieza .e { font-size: 30px; line-height: 1.1; }
  .tira-frase .redondo { width: 64px; height: auto; border-radius: 16px; font-size: 28px; }
  .tira-frase .decir { background: #bfe8c9; }
  .fila-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .inicio-frase { flex: none; border-radius: 16px; background: var(--c); box-shadow: 0 3px 0 var(--sombra); padding: 8px 12px; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; color: #2f3640; }
  .inicio-frase small { font-weight: 600; opacity: .65; font-size: 12px; }
  .pestana { flex: none; border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 800; background: var(--carta); box-shadow: 0 2px 0 var(--sombra); }
  .pestana.si { background: #2f3640; color: #fff; }
  .palabras { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); grid-auto-rows: 118px; gap: 10px; overflow-y: auto; padding-bottom: 8px; }

  /* Festejo suave */
  .estrellita { position: fixed; font-size: 34px; pointer-events: none; z-index: 20; animation: elevar 2.2s ease-out forwards; }
  @keyframes elevar { 0% { opacity: 0; transform: translateY(20px) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-38vh) scale(1.1); } }

  /* Panel para adultos */
  #panel { position: fixed; inset: 0; background: #f7f3ec; color: #2f3640; display: none; flex-direction: column; z-index: 30; }
  #panel.abierto { display: flex; }
  #panel header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid #00000014; }
  #panel header h2 { font-size: 18px; }
  #panel .cuerpo { overflow-y: auto; padding: 8px 16px 40px; -webkit-overflow-scrolling: touch; max-width: 760px; width: 100%; margin: 0 auto; }
  #panel h3 { font-size: 16px; margin: 20px 0 6px; }
  #panel p { color: #6b7180; font-size: 14px; line-height: 1.45; margin: 4px 0 8px; }
  #panel .opcion { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 6px 0; }
  #panel .opcion input { width: 22px; height: 22px; flex: none; }
  #panel .chico { font-size: 14px; padding: 8px 14px; font-weight: 700; }
  .lista-agenda { display: grid; gap: 6px; }
  .lista-agenda .fila { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; background: #fff; border-radius: 14px; padding: 6px 8px; }
  .lista-agenda .fila .e { font-size: 28px; text-align: center; }
  .lista-agenda .fila .b { display: flex; gap: 4px; }
  .lista-agenda .fila .b button { width: 38px; height: 38px; border-radius: 10px; background: #f1ede6; font-size: 16px; }
  .biblioteca { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
  .biblioteca button { background: #fff; border-radius: 12px; padding: 6px 4px; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; }
  .biblioteca button span { font-size: 26px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    .burbuja { animation-duration: 12s !important; }
  }
</style>
</head>
<body>
<div id="barra">
  <button id="volver" class="redondo" title="Volver">🏠</button>
  <h1 id="titulo"></h1>
  <button id="candado" class="redondo" title="Mantén presionado 3 segundos para los ajustes de adultos">🔒</button>
</div>
<main id="vista"></main>

<div id="panel">
  <header><h2>⚙️ Para adultos</h2><button id="cerrar" class="boton verde chico">Listo 🔒</button></header>
  <div class="cuerpo" id="cuerpoPanel"></div>
</div>

<script>
// =====================================================================
//  DATOS
// =====================================================================

// Actividades de la agenda. r = rutina paso a paso que se abre desde la agenda
const ACT = {
  despertar: { e: '🌅', c: '#ffe3b8', es: 'Despertar', en: 'Wake up' },
  bano:      { e: '🚽', c: '#cdeccf', es: 'Ir al baño', en: 'Potty', r: 'bano' },
  manos:     { e: '🧼', c: '#cfe6f7', es: 'Lavar manos', en: 'Wash hands', r: 'manos' },

  vestir:    { e: '👕', c: '#d9dcfb', es: 'Vestirme', en: 'Get dressed', r: 'vestir' },
  desayuno:  { e: '🥣', c: '#ffe8c7', es: 'Desayunar', en: 'Breakfast' },
  comida:    { e: '🍽️', c: '#ffdcc2', es: 'Comer', en: 'Lunch' },
  merienda:  { e: '🍎', c: '#ffd5d0', es: 'Merienda', en: 'Snack' },
  cena:      { e: '🍲', c: '#f6d8c4', es: 'Cenar', en: 'Dinner' },
  escuela:   { e: '🏫', c: '#f4e3a8', es: 'Escuela', en: 'School' },
  tarea:     { e: '✏️', c: '#f1e8c4', es: 'Tarea', en: 'Homework' },
  terapia:   { e: '🧩', c: '#d4ecf7', es: 'Terapia', en: 'Therapy' },
  jugar:     { e: '🧸', c: '#f9e2b0', es: 'Jugar', en: 'Play' },
  parque:    { e: '🛝', c: '#cfedc4', es: 'Parque', en: 'Park' },
  tableta:   { e: '📱', c: '#dfe1ea', es: 'Tableta', en: 'Tablet' },
  leer:      { e: '📚', c: '#ead9f5', es: 'Leer', en: 'Read' },
  musica:    { e: '🎵', c: '#e6d6f7', es: 'Música', en: 'Music' },
  iglesia:   { e: '⛪', c: '#e9e1f5', es: 'Iglesia', en: 'Church' },
  orar:      { e: '🙏', c: '#f6e7d0', es: 'Orar', en: 'Pray' },
  coche:     { e: '🚗', c: '#dbe5f0', es: 'Ir en el coche', en: 'Car ride' },

function leer(k, def) { try { const v = localStorage.getItem('midia.' + k); return v === null ? def : JSON.parse(v); } catch { return def; } }
function guardar(k) { try { localStorage.setItem('midia.' + k, JSON.stringify(E[k])); } catch {} }
const E = {
  idioma: leer('idioma', 'ambos'),          // es | en | ambos
  genero: leer('genero', 'o'),              // o = niño, a = niña (para "cansado/cansada")
  lento: leer('lento', true),               // voz despacio
  sonidos: leer('sonidos', true),
  puertas: { agenda: true, sentir: true, calma: true, historias: true, hablo: true, juegos: true, ...leer('puertas', {}) },   // las puertas nuevas aparecen solas
  memNivel: leer('memNivel', 3),            // pares en el juego de memoria (3 a 6)
  agenda: leer('agenda', AGENDA_INICIAL).filter(id => ACT[id]),
  dia: leer('dia', { fecha: '', i: 0 }),     // hasta dónde va la agenda de hoy
  estrellas: leer('estrellas', 0),
  leidas: leer('leidas', []),               // historias terminadas
};
function hoy() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function revisarDia() { if (E.dia.fecha !== hoy()) { E.dia = { fecha: hoy(), i: 0 }; guardar('dia'); } }
function ganarEstrella() { E.estrellas++; guardar('estrellas'); }

// =====================================================================

// =====================================================================
const lenguas = () => E.idioma === 'ambos' ? ['es', 'en'] : [E.idioma];
const gen = s => (s || '').replaceAll('{o}', E.genero);
const tx = (f, l) => gen(f[l]);
// Etiqueta en pantalla: español grande + inglés chico (o solo uno)
function rot(f) {
  return lenguas().map((l, k) => `<span class="${k ? 'en' : 'es'}">${tx(f, l)}</span>`).join('');
}
// Igual, pero el segundo idioma va chiquito en la misma línea (para botones y subtítulos)
function rotChico(f) {
  const ls = lenguas();
  return tx(f, ls[0]) + (ls[1] ? ` <small>${tx(f, ls[1])}</small>` : '');
}

let turno = 0;
function callar() { turno++; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
function vozDelAparato(l) {
  const vs = speechSynthesis.getVoices(), pref = l === 'es' ? ['es-MX', 'es-US', 'es'] : ['en-US', 'en-GB', 'en'];
  for (const x of pref) { const v = vs.find(v => v.lang.replace('_', '-').toLowerCase().startsWith(x.toLowerCase())); if (v) return v; }
}
function decirUno(s, l, luego) {
  let hecho = false, tm = null;
  const fin = () => { if (hecho) return; hecho = true; clearTimeout(tm); luego(); };
  if (!('speechSynthesis' in window)) { tm = setTimeout(fin, 400); return; }
  const u = new SpeechSynthesisUtterance(s);
  u.lang = l === 'es' ? 'es-MX' : 'en-US'; u.rate = E.lento ? 0.8 : 0.95; u.pitch = 1.05;
  const v = vozDelAparato(l); if (v) u.voice = v;
  u.onend = u.onerror = fin;
  tm = setTimeout(fin, 2000 + s.length * 110);   // por si el navegador no avisa que terminó
  speechSynthesis.speak(u);
}
// Dice una o varias frases {es, en}: primero todo en español y luego en inglés (según el idioma elegido)
function hablar(frases, alTerminar) {
  callar();
  const t = turno, partes = [];
  for (const l of lenguas()) for (const f of [].concat(frases)) { const s = tx(f, l); if (s) partes.push([s, l]); }
  const sig = i => {
    if (t !== turno) return;
    if (i >= partes.length) { alTerminar && alTerminar(); return; }
    decirUno(partes[i][0], partes[i][1], () => setTimeout(() => sig(i + 1), 250));
  };
  sig(0);
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tono(f, dur = 0.25, vol = 0.06, cuando = 0, ataque = 0.02) {
  if (!E.sonidos) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + cuando, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + ataque);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const toque = () => tono(660, 0.18, 0.04);
function festejo() { [523, 659, 784, 1047].forEach((f, i) => tono(f, 0.6, 0.05, i * 0.13)); }
function festejar(n = 6) {
  festejo();
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'estrellita'; s.textContent = ['⭐', '✨', '💛'][i % 3];
    s.style.left = (30 + Math.random() * 40) + 'vw'; s.style.top = (45 + Math.random() * 20) + 'vh';
    s.style.animationDelay = (i * 0.12) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2600 + i * 120);
  }
}

function alSalir(fn) { limpiar.push(fn); }
function cada(ms, fn) { const id = setInterval(fn, ms); alSalir(() => clearInterval(id)); return id; }
function luego(ms, fn) { const id = setTimeout(fn, ms); alSalir(() => clearTimeout(id)); return id; }
function cuadro(fn) { let id; const paso = t => { if (fn(t) !== false) id = requestAnimationFrame(paso); }; id = requestAnimationFrame(paso); alSalir(() => cancelAnimationFrame(id)); }

function ir(p, arg) {

// Tarjeta grande genérica
function carta(o, alTocar, extra = '') {
  const b = document.createElement('button');
  b.className = 'carta ' + extra; b.style.setProperty('--c', o.c || '');
  b.innerHTML = `<span class="emo">${o.e}</span>${rot(o)}`;
  b.onclick = () => { b.classList.remove('salta'); void b.offsetWidth; b.classList.add('salta'); toque(); alTocar(b); };
  return b;
}
// Acomoda n tarjetas para que queden lo más grandes posible
function acomodar(cont, n) {
  const ajustar = () => {
    const w = cont.clientWidth, h = cont.clientHeight, gap = 14;
    let cols = 1, mejor = 0;
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c), t = Math.min((w - (c - 1) * gap) / c, (h - (r - 1) * gap) / r);
      if (t > mejor) { mejor = t; cols = c; }
    }
    cont.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    cont.style.gridTemplateRows = `repeat(${Math.ceil(n / cols)}, 1fr)`;
  };
  ajustar();
  addEventListener('resize', ajustar); alSalir(() => removeEventListener('resize', ajustar));
}

// ---------- Rutina paso a paso ----------
VISTAS.rutina = ({ id, de, paso = 0 }) => {
  const r = RUTINAS[id];
  titulo(r);
  volverA = () => ir(de || 'agenda');
  const ps = r.pasos;
  if (paso >= ps.length) {
    vista.innerHTML = `<div class="centro"><div style="font-size:110px">🌟</div><div>${rot({ es: '¡Lo lograste!', en: 'You did it!' })}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
        <button class="boton" id="otra">🔁 ${tx({ es: 'Otra vez', en: 'Again' }, lenguas()[0])}</button>
        <button class="boton verde" id="listo">✓ ${tx({ es: 'Listo', en: 'Done' }, lenguas()[0])}</button></div></div>`;
    festejar(8); ganarEstrella();
    luego(400, () => hablar([{ es: '¡Lo lograste!', en: 'You did it!' }, { es: '¡Muy bien hecho!', en: 'Well done!' }]));
    vista.querySelector('#otra').onclick = () => { toque(); ir('rutina', { id, de }); };
    vista.querySelector('#listo').onclick = () => { toque(); ir(de || 'agenda'); };
    return;
  }
  const [e, es, en] = ps[paso], f = { es, en };
  const caja = document.createElement('div'); caja.className = 'pasos';
  caja.innerHTML = `<div class="puntos">${ps.map((_, k) => `<i class="${k <= paso ? 'si' : ''}"></i>`).join('')}</div>
    <button class="escena"><span class="emo">${e}</span><div>${rot(f)}</div></button>
    <div class="flechas">
      <button class="redondo" id="atras" ${paso ? '' : 'style="visibility:hidden"'}>◀</button>
      <button class="boton verde" id="sig" style="font-size:22px;padding:16px">✓ ${tx({ es: '¡Listo!', en: 'Done!' }, lenguas()[0])}</button>
      <button class="redondo" id="oir">🔊</button>
    </div>`;
  vista.appendChild(caja);
  const decir = () => hablar(f);
  caja.querySelector('.escena').onclick = () => { toque(); decir(); };
  caja.querySelector('#oir').onclick = () => { toque(); decir(); };
  caja.querySelector('#atras').onclick = () => { toque(); ir('rutina', { id, de, paso: paso - 1 }); };
  caja.querySelector('#sig').onclick = () => { tono(784, 0.3, 0.05); tono(988, 0.4, 0.04, 0.1); ir('rutina', { id, de, paso: paso + 1 }); };
  luego(200, decir);
};

// ---------- Espera (reloj visual) ----------
VISTAS.espera = (min) => {
  titulo({ es: 'Esperar', en: 'Wait' });
  volverA = () => ir('agenda');
  const caja = document.createElement('div'); caja.className = 'espera';
  if (!min) {
    caja.innerHTML = `<div style="font-size:70px">⏳</div><div class="opciones"></div>`;
    for (const m of [1, 2, 5, 10]) {
      const o = { e: '⏱️', c: '#d4eef5', es: `${m} ${m === 1 ? 'minuto' : 'minutos'}`, en: `${m} ${m === 1 ? 'minute' : 'minutes'}` };
      caja.querySelector('.opciones').appendChild(carta(o, () => ir('espera', m)));
    }
    vista.appendChild(caja);
    luego(200, () => hablar({ es: '¿Cuánto tiempo esperamos?', en: 'How long do we wait?' }));
    return;
  }
  const R = 45, C = 2 * Math.PI * R, total = min * 60000, t0 = Date.now();
  caja.innerHTML = `
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="#ffffff" stroke="#e6e2da" stroke-width="8"/>
      <circle id="arco" cx="50" cy="50" r="${R}" fill="none" stroke="#7fb8c9" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>
      <circle id="disco" cx="50" cy="50" r="36" fill="#bfe0ea"/>
      <text id="reloj" x="50" y="56" text-anchor="middle" font-size="15" font-weight="800" fill="#2f3640"></text></svg>
    <div id="msg">${rot({ es: 'Esperamos un poquito…', en: 'We wait a little…' })}</div>
    <button class="boton" id="parar">✋ ${tx({ es: 'Terminar', en: 'Stop' }, lenguas()[0])}</button>`;
  vista.appendChild(caja);
  const arco = caja.querySelector('#arco'), disco = caja.querySelector('#disco'), reloj = caja.querySelector('#reloj');
  hablar({ es: `Vamos a esperar ${min} ${min === 1 ? 'minuto' : 'minutos'}.`, en: `We will wait ${min} ${min === 1 ? 'minute' : 'minutes'}.` });
  caja.querySelector('#parar').onclick = () => { toque(); ir('agenda'); };
  let fin = false;
  cada(250, () => {
    if (fin) return;
    const quedan = Math.max(0, total - (Date.now() - t0)), f = quedan / total;
    arco.setAttribute('stroke-dashoffset', C * (1 - f));
    disco.setAttribute('r', 8 + 28 * f);
    const s = Math.ceil(quedan / 1000);
    reloj.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (quedan <= 0) {
      fin = true; festejar(5);
      caja.querySelector('#msg').innerHTML = rot({ es: '¡Ya terminó la espera!', en: 'Waiting time is over!' });
      hablar({ es: '¡Listo! Ya terminó la espera. Esperaste muy bien.', en: 'All done! Waiting time is over. You waited so well.' });
    }
  });
};

const HERRAMIENTAS = {
  respirar() {
    vista.innerHTML = `<div class="centro"><div class="globo"></div><div id="txt"></div><div id="cuenta" style="color:var(--muted);font-weight:700"></div></div>`;
    const globo = vista.querySelector('.globo'), txt = vista.querySelector('#txt'), cuenta = vista.querySelector('#cuenta');
    const CICLOS = 5, T = 4;   // 4 s inhalar, 4 s exhalar
    let t0 = null, fase = -1;
    const fin = () => {
      txt.innerHTML = rot({ es: '¡Muy bien! Tu cuerpo está más tranquilo.', en: 'Great job! Your body is calmer.' });
      cuenta.innerHTML = `<button class="boton" id="otra">🔁 ${tx({ es: 'Otra vez', en: 'Again' }, lenguas()[0])}</button>`;
      vista.querySelector('#otra').onclick = () => { toque(); ir('herramienta', 'respirar'); };
      hablar({ es: '¡Muy bien! Tu cuerpo está más tranquilo.', en: 'Great job! Your body is calmer.' });
      ganarEstrella();
    };
    hablar({ es: 'Mira el globo. Respiramos juntos.', en: 'Watch the balloon. We breathe together.' }, () => {
      cuadro(now => {
        t0 ??= now;
        const s = (now - t0) / 1000, ciclo = Math.floor(s / (2 * T)), en = s % (2 * T), inh = en < T;
        if (ciclo >= CICLOS) { globo.style.transform = 'scale(.45)'; fin(); return false; }
        const p = inh ? en / T : 1 - (en - T) / T;
        globo.style.transform = `scale(${0.45 + 0.55 * (0.5 - 0.5 * Math.cos(Math.PI * p))})`;
        const nf = ciclo * 2 + (inh ? 0 : 1);
        if (nf !== fase) {
          fase = nf;
          const f = inh ? { es: 'Inhala…', en: 'Breathe in…' } : { es: 'Exhala…', en: 'Breathe out…' };
          txt.innerHTML = rot(f); cuenta.textContent = `${ciclo + 1} / ${CICLOS}`;
          if (E.idioma === 'ambos') hablar({ es: f.es, en: '' }); else hablar(f);   // cortito para no tapar la respiración
          tono(inh ? 330 : 392, T - 0.3, 0.035, 0, T * 0.5);
        }
      });
    });
  },

  burbujas() {
    vista.style.overflowY = 'hidden';
    vista.innerHTML = `<div class="burbujas"></div><div class="centro sobre" style="pointer-events:none;height:auto;padding-top:20px"><div>${rot({ es: 'Toca las burbujas', en: 'Pop the bubbles' })}</div></div>`;
    const caja = vista.querySelector('.burbujas');
    hablar({ es: 'Toca las burbujas, despacito.', en: 'Pop the bubbles, nice and slow.' });
    const nueva = () => {
      if (caja.children.length >= 10) return;
      const b = document.createElement('div'), d = 60 + Math.random() * 70;
      b.className = 'burbuja';
      b.style.width = b.style.height = d + 'px';
      b.style.left = (Math.random() * 85) + '%';
      b.style.setProperty('--dx', ((Math.random() - 0.5) * 120) + 'px');
      b.style.animationDuration = (10 + Math.random() * 6) + 's';
      b.addEventListener('animationend', () => b.remove());
      b.addEventListener('pointerdown', () => {
        if (b.classList.contains('pum')) return;
        const t = getComputedStyle(b).transform, aqui = t === 'none' ? '' : t;   // revienta donde está, no abajo
        b.style.transform = aqui; b.style.setProperty('--t', aqui);
        b.classList.add('pum');
        tono(PENTA[Math.floor(Math.random() * PENTA.length)] * 1.5, 0.35, 0.05);
      });
      caja.appendChild(b);
    };
    for (let k = 0; k < 4; k++) luego(k * 400, nueva);
    cada(1100, nueva);
  },

  musica() {
    vista.style.overflowY = 'hidden';
    vista.innerHTML = `<div class="manchas"><i></i><i></i><i></i></div>
      <div class="centro sobre"><div style="font-size:80px">🎶</div><div>${rot({ es: 'Escucha la música suave', en: 'Listen to the soft music' })}</div>
      <div style="color:var(--muted);font-size:16px">${rot({ es: 'Respira despacio y descansa.', en: 'Breathe slowly and rest.' })}</div></div>`;
    hablar({ es: 'Escucha la música suave.', en: 'Listen to the soft music.' });
    if (!E.sonidos) return;
    let k = 0;
    const nota = () => {
      const f = PENTA[Math.floor(Math.random() * 7)];
      tono(f, 3.5, 0.045, 0, 0.8);
      if (k++ % 3 === 0) tono(f / 2, 5, 0.03, 0, 1.5);   // bajo suave de vez en cuando
    };
    luego(1500, nota);
    cada(1700, () => { if (Math.random() < 0.8) nota(); });
  },

  mariposa() {
    vista.innerHTML = `<div class="centro"><div style="font-size:70px">🦋</div>
      <div class="manos"><span id="izq">🤚</span><span id="der">✋</span></div><div id="txt"></div><div id="cuenta" style="color:var(--muted);font-weight:700"></div></div>`;
    const txt = vista.querySelector('#txt'), cuenta = vista.querySelector('#cuenta'), izq = vista.querySelector('#izq'), der = vista.querySelector('#der');
    const inst = { es: 'Cruza tus brazos sobre tu pecho, como una mariposa. Da palmaditas suaves: una mano, luego la otra.', en: 'Cross your arms over your chest, like a butterfly. Tap gently: one hand, then the other.' };
    txt.innerHTML = rot(inst);
    hablar(inst, () => {
      let n = 0;
      const id = cada(1100, () => {
        n++;
        const lado = n % 2 ? izq : der, otro = n % 2 ? der : izq;
        lado.classList.add('toca'); otro.classList.remove('toca');
        tono(n % 2 ? 392 : 330, 0.5, 0.04);
        cuenta.textContent = `${n} / 16`;
        if (n >= 16) {
          clearInterval(id); lado.classList.remove('toca');
          txt.innerHTML = rot({ es: '¡Muy bien! Estás a salvo y Dios te ama.', en: 'Great job! You are safe and God loves you.' });
          hablar({ es: '¡Muy bien! Estás a salvo y Dios te ama.', en: 'Great job! You are safe and God loves you.' });
          ganarEstrella();
        }
      });
    });
  },

  contar() {
    vista.innerHTML = `<div class="centro"><div id="txt">${rot({ es: 'Contamos despacio', en: 'We count slowly' })}</div>
      <div class="conteo">${Array.from({ length: 10 }, (_, k) => `<i>${k + 1}</i>`).join('')}</div><div id="fin"></div></div>`;
    const ps = vista.querySelectorAll('.conteo i');
    const paso = n => {
      if (n > 10) {
        vista.querySelector('#fin').innerHTML = `<button class="boton" id="otra">🔁 ${tx({ es: 'Otra vez', en: 'Again' }, lenguas()[0])}</button>`;
        vista.querySelector('#otra').onclick = () => { toque(); ir('herramienta', 'contar'); };
        hablar({ es: '¡Muy bien! Contaste hasta diez.', en: 'Great job! You counted to ten.' });
        ganarEstrella();
        return;
      }
      ps[n - 1].classList.add('si');
      tono(PENTA[n - 1], 0.6, 0.04);
      hablar({ es: NUM.es[n], en: NUM.en[n] }, () => luego(700, () => paso(n + 1)));
    };
    hablar({ es: 'Contamos despacio, juntos.', en: 'We count slowly, together.' }, () => luego(500, () => paso(1)));
  },

  orar() {
    const ora = { es: 'Dios, gracias porque me cuidas y me amas. Ayúdame a estar en calma. Amén.', en: 'God, thank you for taking care of me and loving me. Help me feel calm. Amen.' };
    const ver = { es: 'Cuando tengo miedo, confío en ti. (Salmo 56:3)', en: 'When I am afraid, I trust in you. (Psalm 56:3)' };
    vista.innerHTML = `<div class="centro" style="max-width:640px;margin:0 auto"><div style="font-size:90px">🙏</div><div>${rot(ora)}</div>
      <div style="font-size:15px;opacity:.85">${rot(ver)}</div><button class="redondo" id="oir">🔊</button></div>`;
    vista.querySelectorAll('.centro .es').forEach(s => s.style.fontSize = '24px');
    const decir = () => hablar([ora, ver]);
    vista.querySelector('#oir').onclick = () => { toque(); decir(); };
    luego(300, decir);
  },
};

// ---------- Juegos que enseñan ----------
const revolver = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const azar = a => a[Math.floor(Math.random() * a.length)];
const BIEN = [{ es: '¡Muy bien!', en: 'Great job!' }, { es: '¡Eso es!', en: 'That\'s it!' }, { es: '¡Excelente!', en: 'Excellent!' }, { es: '¡Lo encontraste!', en: 'You found it!' }];
const OTRA = [{ es: 'Mmm… intenta otra vez.', en: 'Hmm… try again.' }, { es: 'Casi. ¡Tú puedes!', en: 'Almost. You can do it!' }];
let J = null;   // partida actual: { id, ronda, n, rondas[] }

VISTAS.juegos = () => {
  titulo({ es: 'Juegos', en: 'Games' });
  const r = document.createElement('div'); r.className = 'rejilla';
  for (const j of JUEGOS) r.appendChild(carta(j, () => { ir('juego', { id: j.id }); hablar(j); }));
  vista.appendChild(r);
  acomodar(r, JUEGOS.length);
};

// Prepara las rondas de cada juego (5 por partida, sin repetir)
const PREPARAR = {
  cara: () => revolver(EMOCIONES.filter(e => e.id !== 'demasiado')).slice(0, 5).map(em => ({
    escena: '❓', pregunta: { es: `¿Dónde está la cara ${em.es.replaceAll('{o}', 'a').toLowerCase()}?`, en: `Where is the ${em.en.toLowerCase()} face?` },
    opciones: revolver([em, ...revolver(EMOCIONES.filter(x => x.id !== em.id && x.id !== PARECIDAS[em.id] && x.id !== 'demasiado')).slice(0, 2)])
      .map(x => ({ e: x.e, c: x.c, es: x.es, en: x.en, ok: x === em })),
    bien: em.di,
  })).map(r => { r.pregunta.es = r.pregunta.es.replace('cara me duele', 'cara que dice "me duele"'); r.pregunta.en = r.pregunta.en.replace('it hurts face', '"it hurts" face'); return r; }),
  siente: () => revolver(SITUACIONES).slice(0, 5).map(([escena, es, en, id]) => {
    const em = EMOCIONES.find(x => x.id === id), ella = /\b(she|her|girl)\b/i.test(en), g = ella ? 'a' : 'o';   // niño o niña de la historia
    const bien = id === 'duele' ? { es: 'Le duele.', en: 'It hurts.' }
      : id === 'demasiado' ? { es: `Es demasiado para ${ella ? 'ella' : 'él'}.`, en: `It is too much for ${ella ? 'her' : 'him'}.` }
      : { es: `Se siente ${em.es.replaceAll('{o}', g).toLowerCase()}.`, en: `${ella ? 'She' : 'He'} feels ${em.en.toLowerCase()}.` };
    return {
      escena, situacion: { es, en }, pregunta: { es: '¿Cómo se siente?', en: ella ? 'How does she feel?' : 'How does he feel?' },
      opciones: revolver([em, ...revolver(EMOCIONES.filter(x => x.id !== id && x.id !== PARECIDAS[id])).slice(0, 2)])
        .map(x => ({ e: x.e, c: x.c, es: x.es.replaceAll('{o}', g), en: x.en, ok: x === em })),
      bien,
    };
  }),
  hago: () => revolver(DILEMAS).slice(0, 5).map(([escena, es, en, b, o, pes, pen]) => ({
    escena, situacion: { es, en }, pregunta: { es: '¿Qué hago?', en: 'What do I do?' }, larga: true,
    opciones: revolver([{ e: b[0], c: '#d4eef5', es: b[1], en: b[2], ok: true }, { e: o[0], c: '#f3e6d8', es: o[1], en: o[2], ok: false }]),
    bien: { es: pes, en: pen },
  })),
  orden: () => revolver(Object.entries(TRIOS).flatMap(([id, ts]) => ts.map(t => ({ rutina: RUTINAS[id], pasos: t.map(k => RUTINAS[id].pasos[k]) })))).slice(0, 5),
};

VISTAS.juego = ({ id, nuevo = true }) => {
  const j = JUEGOS.find(x => x.id === id);
  titulo(j);
  volverA = () => ir('juegos');
  if (id === 'memoria') return memoria();
  if (nuevo || !J || J.id !== id) J = { id, ronda: 0, rondas: PREPARAR[id]() };
  if (J.ronda >= J.rondas.length) return finJuego(id);
  const R = J.rondas[J.ronda];
  const puntos = `<div class="puntos">${J.rondas.map((_, k) => `<i class="${k < J.ronda ? 'si' : ''}"></i>`).join('')}</div>`;
  const siguiente = () => { J.ronda++; ir('juego', { id, nuevo: false }); };
  id === 'orden' ? rondaOrden(R, puntos, siguiente) : rondaOpciones(R, puntos, siguiente);
};

function rondaOpciones(R, puntos, siguiente) {
  const caja = document.createElement('div'); caja.className = 'juego';
  const texto = R.situacion ? `${rot(R.situacion)}<span class="en" style="color:var(--fg);opacity:1;font-weight:800">${tx(R.pregunta, lenguas()[0])}</span>` : rot(R.pregunta);
  caja.innerHTML = `${puntos}<button class="escena"><span class="emo">${R.escena}</span><div>${texto}</div></button><div class="opciones-j"></div>`;
  const ops = caja.querySelector('.opciones-j');
  ops.style.gridTemplateColumns = `repeat(${R.opciones.length}, 1fr)`;
  vista.appendChild(caja);
  const decirPregunta = () => hablar(R.situacion ? [R.situacion, R.pregunta] : R.pregunta);
  let fallos = 0, listo = false;
  for (const o of R.opciones) {
    const b = carta(o, () => {
      if (listo) return;
      if (o.ok) {
        listo = true; b.classList.remove('pista'); b.classList.add('bien'); festejar(3);
        hablar([azar(BIEN), R.bien], () => luego(700, siguiente));
      } else {
        if (b.classList.contains('apagada')) { hablar(o); return; }
        fallos++; b.classList.add('apagada'); tono(330, 0.3, 0.03);
        hablar([o, azar(OTRA)]);
        if (fallos >= 2 || R.opciones.length === 2) ops.querySelector('.ok')?.classList.add('pista');
      }
    }, (o.ok ? 'ok ' : '') + (R.larga ? 'larga' : ''));
    ops.appendChild(b);
  }
  caja.querySelector('.escena').onclick = () => { toque(); decirPregunta(); };
  luego(250, decirPregunta);
}

function rondaOrden(R, puntos, siguiente) {
  const caja = document.createElement('div'); caja.className = 'orden';
  caja.innerHTML = `${puntos}<h2>${rotChico(R.rutina)}</h2>
    <div class="huecos">${R.pasos.map((_, k) => `<div class="hueco"><b>${k + 1}</b></div>`).join('')}</div><div class="filas-orden"></div>`;
  const filas = caja.querySelector('.filas-orden'), huecos = caja.querySelectorAll('.hueco');
  vista.appendChild(caja);
  let toca = 0, fallos = 0;
  const botones = [];
  for (const k of revolver([0, 1, 2])) {
    const [e, es, en] = R.pasos[k], b = document.createElement('button');
    b.className = 'paso-btn'; b.style.setProperty('--c', '#fff');
    b.innerHTML = `<span class="e">${e}</span><span>${rot({ es, en })}</span>`;
    b.onclick = () => {
      if (k === toca) {
        tono(PENTA[4 + toca], 0.4, 0.05);
        huecos[toca].innerHTML += e; huecos[toca].classList.add('lleno');
        b.classList.add('usado'); b.classList.remove('pista');
        toca++; fallos = 0;
        if (toca === 3) { festejar(4); hablar([azar(BIEN), { es: R.pasos.map(p => p[1]).join(' '), en: R.pasos.map(p => p[2]).join(' ') }], () => luego(600, siguiente)); }
        else hablar({ es, en });
      } else {
        fallos++; tono(330, 0.3, 0.03);
        b.classList.remove('mueve'); void b.offsetWidth; b.classList.add('mueve');
        hablar(toca ? { es: '¿Qué sigue?', en: 'What comes next?' } : { es: '¿Qué va antes?', en: 'What comes before?' });
        if (fallos >= 2) botones.find(x => x.k === toca).b.classList.add('pista');
      }
    };
    botones.push({ k, b }); filas.appendChild(b);
  }
  luego(250, () => hablar([{ es: `${R.rutina.es}. ¿Qué va primero?`, en: `${R.rutina.en}. What comes first?` }]));
}

function memoria() {
  const n = Math.min(6, Math.max(3, E.memNivel));
  const cartas = revolver(revolver(PARES).slice(0, n).flatMap(p => [p, p]));
  const mesa = document.createElement('div'); mesa.className = 'mesa';
  vista.appendChild(mesa);
  let abiertas = [], pares = 0, ocupado = false;
  for (const p of cartas) {
    const b = document.createElement('button'); b.className = 'mem';
    b.innerHTML = `<span>${p[0]}</span>`;
    b.onclick = () => {
      if (ocupado || b.classList.contains('abierta') || b.classList.contains('par')) return;
      toque(); b.classList.add('abierta'); abiertas.push({ b, p });
      hablar({ es: p[1], en: p[2] });
      if (abiertas.length < 2) return;
      const [a1, a2] = abiertas; abiertas = [];
      if (a1.p === a2.p) {
        a1.b.classList.replace('abierta', 'par'); a2.b.classList.replace('abierta', 'par');
        pares++; tono(784, 0.4, 0.05); tono(988, 0.5, 0.04, 0.12);
        if (pares === n) luego(900, () => finJuego('memoria'));
      } else {
        ocupado = true;
        luego(1300, () => { a1.b.classList.remove('abierta'); a2.b.classList.remove('abierta'); ocupado = false; });
      }
    };
    mesa.appendChild(b);
  }
  acomodar(mesa, cartas.length);
  luego(250, () => hablar({ es: 'Encuentra las parejas iguales.', en: 'Find the matching pairs.' }));
}

function finJuego(id) {
  festejar(8); ganarEstrella();
  const masDificil = id === 'memoria' && E.memNivel < 6;
  vista.innerHTML = `<div class="centro"><div style="font-size:110px">🏆</div><div>${rot({ es: '¡Jugaste muy bien!', en: 'You played so well!' })}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="boton" id="otra">🔁 ${tx({ es: 'Otra vez', en: 'Again' }, lenguas()[0])}</button>
      ${masDificil ? `<button class="boton azul" id="mas">➕ ${tx({ es: 'Más cartas', en: 'More cards' }, lenguas()[0])}</button>` : ''}
      <button class="boton verde" id="juegos">🎮 ${tx({ es: 'Más juegos', en: 'More games' }, lenguas()[0])}</button></div></div>`;
  hablar({ es: '¡Jugaste muy bien! Ganaste una estrella.', en: 'You played so well! You earned a star.' });
  vista.querySelector('#otra').onclick = () => { toque(); ir('juego', { id }); };
  vista.querySelector('#juegos').onclick = () => { toque(); ir('juegos'); };
  if (masDificil) vista.querySelector('#mas').onclick = () => { toque(); E.memNivel++; guardar('memNivel'); ir('juego', { id }); };
}

// ---------- Hablo (frases con dibujos) ----------
let frase = [], catActual = 'comer';
VISTAS.hablo = () => {
  titulo({ es: 'Hablo', en: 'I talk' });
  const caja = document.createElement('div'); caja.className = 'hablo';
  caja.innerHTML = `
    <div class="tira-frase"><div class="piezas"></div>
      <button class="redondo" id="borrar" title="Borrar">⌫</button>
      <button class="redondo decir" id="decir" title="Decir">▶</button></div>
    <div class="fila-scroll" id="inicios"></div>
    <div class="fila-scroll" id="cats"></div>
    <div class="palabras"></div>`;
  vista.appendChild(caja);
  vista.style.overflowY = 'hidden';
  const piezas = caja.querySelector('.piezas'), palabras = caja.querySelector('.palabras');

  const pintarFrase = () => {
    piezas.innerHTML = '';
    for (const w of frase) {
      const d = document.createElement('div'); d.className = 'pieza'; d.style.setProperty('--c', w.c);
      d.innerHTML = `<span class="e">${w.e}</span>${tx(w, lenguas()[0])}`;
      piezas.appendChild(d);
    }
    piezas.scrollLeft = piezas.scrollWidth;
  };
  const agregar = w => {
    toque();
    if (frase.length >= 8) frase.shift();
    frase.push(w); pintarFrase(); hablar(w);
  };
  caja.querySelector('#borrar').onclick = () => { toque(); frase.pop(); pintarFrase(); };
  caja.querySelector('#borrar').oncontextmenu = e => { e.preventDefault(); frase = []; pintarFrase(); };
  caja.querySelector('#decir').onclick = () => {
    if (!frase.length) return;
    tono(784, 0.25, 0.04);
    hablar({ es: frase.map(w => w.es).join(' '), en: frase.map(w => w.en).join(' ') });
    piezas.classList.remove('salta'); void piezas.offsetWidth; piezas.classList.add('salta');
  };

  const ini = caja.querySelector('#inicios');
  for (const w of INICIOS) {
    const b = document.createElement('button'); b.className = 'inicio-frase'; b.style.setProperty('--c', w.c);
    b.innerHTML = `${w.e} <span>${tx(w, lenguas()[0])}</span>${lenguas()[1] ? `<small>${tx(w, 'en')}</small>` : ''}`;
    b.onclick = () => agregar(w);
    ini.appendChild(b);
  }
  const cats = caja.querySelector('#cats');
  const pintarCat = () => {
    cats.innerHTML = '';
    for (const c of CATEGORIAS) {
      const b = document.createElement('button'); b.className = 'pestana' + (c.id === catActual ? ' si' : '');
      b.textContent = `${c.e} ${tx(c, lenguas()[0])}`;
      b.onclick = () => { toque(); catActual = c.id; pintarCat(); hablar(c); };
      cats.appendChild(b);
    }
    const c = CATEGORIAS.find(x => x.id === catActual);
    palabras.innerHTML = ''; palabras.scrollTop = 0;
    for (const [e, es, en] of c.w) {
      const w = { e, es, en, c: c.c };
      const b = carta(w, () => { frase.length >= 8 && frase.shift(); frase.push(w); pintarFrase(); hablar(w); });
      palabras.appendChild(b);
    }
  };
  pintarCat(); pintarFrase();
};

// =====================================================================
//  PANEL PARA ADULTOS
// =====================================================================
const panel = document.getElementById('panel'), cuerpo = document.getElementById('cuerpoPanel');
function radio(nombre, valor, actual, texto) {
  return `<label class="opcion"><input type="radio" name="${nombre}" value="${valor}" ${actual === valor ? 'checked' : ''}>${texto}</label>`;
}
function pintarPanel() {
  revisarDia();
  cuerpo.innerHTML = `
    <p>Esta app está diseñada pensando en niños neurodivergentes de 3 a 10 años. Es un apoyo para la familia: <b>no sustituye la terapia</b>. Coordina las rutinas, historias y la comunicación con su terapeuta. Todo se guarda solo en este aparato.</p>
    <h3>Idioma / Language</h3>
    ${radio('idioma', 'ambos', E.idioma, 'Bilingüe (español + English)')}${radio('idioma', 'es', E.idioma, 'Español')}${radio('idioma', 'en', E.idioma, 'English')}
    <h3>¿Para un niño o una niña?</h3>
    <p>Cambia frases como "Estoy cansado / cansada".</p>
    ${radio('genero', 'o', E.genero, 'Niño')}${radio('genero', 'a', E.genero, 'Niña')}
    <h3>Voz y sonidos</h3>
    <label class="opcion"><input type="checkbox" id="lento" ${E.lento ? 'checked' : ''}>Voz más despacio</label>
    <label class="opcion"><input type="checkbox" id="sonidos" ${E.sonidos ? 'checked' : ''}>Sonidos y música suaves</label>
    <h3>Puertas que se ven en el inicio</h3>
    <p>Para los más pequeños, empieza con pocas (por ejemplo, Hablo y Rincón de calma).</p>
    ${PUERTAS.map(p => `<label class="opcion"><input type="checkbox" data-puerta="${p.id}" ${E.puertas[p.id] ? 'checked' : ''}>${p.e} ${p.es}</label>`).join('')}
    <h3>📅 Mi día: la agenda</h3>
    <p>Ordena las actividades de un día normal. Cada noche la agenda vuelve a empezar sola.</p>
    <div class="lista-agenda">${E.agenda.map((id, k) => `<div class="fila"><span class="e">${ACT[id].e}</span><span>${ACT[id].es}${k < E.dia.i ? ' ✓' : k === E.dia.i ? ' ← ahora' : ''}</span>
      <span class="b"><button data-sube="${k}">↑</button><button data-baja="${k}">↓</button><button data-quita="${k}">✕</button></span></div>`).join('')}</div>
    <p style="margin-top:10px">Toca para agregar:</p>
    <div class="biblioteca">${Object.entries(ACT).map(([id, a]) => `<button data-agrega="${id}"><span>${a.e}</span>${a.es}</button>`).join('')}</div>
    <p style="margin-top:10px"><button class="boton chico" id="reiniciarDia">↺ Empezar el día otra vez</button>
      <button class="boton chico" id="agendaInicial">Agenda de ejemplo</button></p>
    <h3>Estrellas</h3>
    <p>Lleva ⭐ ${E.estrellas}. Se ganan al terminar rutinas, historias y ejercicios de calma (nunca se pierden).</p>
    <h3>Pantalla</h3>
    <p><button class="boton chico" id="completa">⛶ Pantalla completa</button></p>
    <h3>Borrar</h3>
    <p><button class="boton chico" id="borrarTodo">🗑 Borrar todo y empezar de cero</button></p>`;

  cuerpo.querySelectorAll('input[name=idioma]').forEach(r => r.onchange = () => { E.idioma = r.value; guardar('idioma'); });
  cuerpo.querySelectorAll('input[name=genero]').forEach(r => r.onchange = () => { E.genero = r.value; guardar('genero'); });
  cuerpo.querySelector('#lento').onchange = e => { E.lento = e.target.checked; guardar('lento'); };
  cuerpo.querySelector('#sonidos').onchange = e => { E.sonidos = e.target.checked; guardar('sonidos'); };
  cuerpo.querySelectorAll('[data-puerta]').forEach(c => c.onchange = () => {
    E.puertas[c.dataset.puerta] = c.checked;
    if (!Object.values(E.puertas).some(Boolean)) { E.puertas[c.dataset.puerta] = true; c.checked = true; }   // al menos una
    guardar('puertas');
  });
  const cambiarAgenda = () => { guardar('agenda'); E.dia.i = Math.min(E.dia.i, E.agenda.length); guardar('dia'); pintarPanel(); };
  cuerpo.querySelectorAll('[data-sube]').forEach(b => b.onclick = () => { const k = +b.dataset.sube; if (k > 0) [E.agenda[k - 1], E.agenda[k]] = [E.agenda[k], E.agenda[k - 1]]; cambiarAgenda(); });
  cuerpo.querySelectorAll('[data-baja]').forEach(b => b.onclick = () => { const k = +b.dataset.baja; if (k < E.agenda.length - 1) [E.agenda[k + 1], E.agenda[k]] = [E.agenda[k], E.agenda[k + 1]]; cambiarAgenda(); });
  cuerpo.querySelectorAll('[data-quita]').forEach(b => b.onclick = () => { const k = +b.dataset.quita; E.agenda.splice(k, 1); if (k < E.dia.i) E.dia.i--; cambiarAgenda(); });
  cuerpo.querySelectorAll('[data-agrega]').forEach(b => b.onclick = () => { E.agenda.push(b.dataset.agrega); cambiarAgenda(); });
  cuerpo.querySelector('#reiniciarDia').onclick = () => { E.dia = { fecha: hoy(), i: 0 }; guardar('dia'); pintarPanel(); };
  cuerpo.querySelector('#agendaInicial').onclick = () => { if (confirm('¿Cambiar la agenda por la de ejemplo?')) { E.agenda = [...AGENDA_INICIAL]; E.dia = { fecha: hoy(), i: 0 }; guardar('dia'); cambiarAgenda(); } };
  cuerpo.querySelector('#completa').onclick = () => { const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d); };
  cuerpo.querySelector('#borrarTodo').onclick = () => {
    if (!confirm('¿Borrar la agenda, las estrellas y todos los ajustes de este aparato?')) return;
    try { Object.keys(localStorage).filter(k => k.startsWith('midia.')).forEach(k => localStorage.removeItem(k)); } catch {}
    location.reload();
  };
}
function abrirPanel() { callar(); pintarPanel(); panel.classList.add('abierto'); }
document.getElementById('cerrar').onclick = () => { panel.classList.remove('abierto'); ir('inicio'); };

const bCand = document.getElementById('candado');
let tCand = null;
bCand.addEventListener('pointerdown', () => {
  bCand.classList.add('cargando');
  tCand = setTimeout(() => { tCand = null; bCand.classList.remove('cargando'); abrirPanel(); }, 3000);
});
const soltarCandado = () => { if (tCand) { clearTimeout(tCand); tCand = null; bCand.classList.remove('cargando'); } };
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => bCand.addEventListener(t, soltarCandado));
addEventListener('contextmenu', e => e.preventDefault());

ir('inicio');
</script>
